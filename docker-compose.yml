services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ci_lab
      POSTGRES_USER: ci_lab
      POSTGRES_PASSWORD: ci_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_lab -d ci_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
