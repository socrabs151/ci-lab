services:
  jenkins:
    build: .
    container_name: ci-lab-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      DOCKERHUB_USER: ${DOCKERHUB_USER}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN}
      RAILWAY_TOKEN: ${RAILWAY_TOKEN}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_TO: ${MAIL_TO}
      SONAR_TOKEN: ${SONAR_TOKEN}
      GITHUB_REPO_URL: ${GITHUB_REPO_URL}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc:/var/jenkins_home/casc_configs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE}/.kube:/var/jenkins_home/.kube:ro
    restart: unless-stopped

volumes:
  jenkins_home:
