stages:
  - test
  - build
  - deploy

variables:
  NODE_IMAGE: node:22-alpine
  DOCKER_DRIVER: overlay2
  IMAGE_REPO: docker.io/$DOCKERHUB_USER/ci-lab
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

node_test:
  stage: test
  image: $NODE_IMAGE
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/
    reports:
      junit: reports/junit.xml

sonarqube:
  stage: test
  needs: []
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  tags:
    - local

docker_build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
  script:
    - docker build -t "$IMAGE_REPO:$IMAGE_TAG" .
    - docker push "$IMAGE_REPO:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

migrate_db:
  stage: deploy
  needs: ["docker_build"]
  image:
    name: flyway/flyway:10
    entrypoint: [""]
  script:
    - flyway -url="jdbc:postgresql://$DB_HOST:$DB_PORT/$DB_NAME" -user="$DB_USER" -password="$DB_PASSWORD" -locations=filesystem:db/migration migrate
    - flyway -url="jdbc:postgresql://$DB_HOST:$DB_PORT/$DB_NAME" -user="$DB_USER" -password="$DB_PASSWORD" -locations=filesystem:db/migration info
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  tags:
    - local

deploy_k8s:
  stage: deploy
  needs: ["docker_build"]
  image: dtzar/helm-kubectl:3.15
  script:
    - export KUBECONFIG="$KUBE_CONFIG"
    - kubectl get nodes
    - helm upgrade --install ci-lab helm/ci-lab --namespace ci-lab --create-namespace --set image.repository="$IMAGE_REPO" --set image.tag="$IMAGE_TAG" --wait --timeout 180s
    - kubectl -n ci-lab get pods,svc
  environment:
    name: production
    url: http://ci-lab.local
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  tags:
    - local
