name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ci-lab-package
          path: dist/*.tgz

      - name: Notify email
        if: always()
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf 'Subject: CI %s %s\nFrom: %s\nTo: %s\nContent-Type: text/plain; charset=UTF-8\n\nJob: %s\nRepo: %s\nCommit: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$JOB_STATUS" "$GITHUB_REPOSITORY" "$MAIL_FROM" "$MAIL_TO" \
            "$GITHUB_JOB" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > mail.txt
          curl -s --url "smtps://${MAIL_HOST}:${MAIL_PORT}" --ssl-reqd \
            --mail-from "$MAIL_FROM" --mail-rcpt "$MAIL_TO" \
            --user "${MAIL_USER}:${MAIL_PASS}" --upload-file mail.txt
