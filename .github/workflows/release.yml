name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            PREV=$(git rev-list --max-parents=0 HEAD | head -n 1)
          fi
          node scripts/changelog.js --from "$PREV" --to HEAD --output RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*.tgz
          generate_release_notes: true

      - name: Notify email
        if: always()
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf 'Subject: Release %s %s\nFrom: %s\nTo: %s\nContent-Type: text/plain; charset=UTF-8\n\nTag: %s\nStatus: %s\nRepo: %s\n' \
            "$GITHUB_REF_NAME" "$JOB_STATUS" "$MAIL_FROM" "$MAIL_TO" \
            "$GITHUB_REF_NAME" "$JOB_STATUS" "$GITHUB_REPOSITORY" > mail.txt
          curl -s --url "smtps://${MAIL_HOST}:${MAIL_PORT}" --ssl-reqd \
            --mail-from "$MAIL_FROM" --mail-rcpt "$MAIL_TO" \
            --user "${MAIL_USER}:${MAIL_PASS}" --upload-file mail.txt
